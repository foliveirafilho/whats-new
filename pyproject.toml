[project]
name = "whats-new"
version = "0.1.0"
description = "Daily local AI-news routine: fetch, dedupe and stage candidates for Claude to curate"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
whats-new = "whats_new.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whats_new"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
