# Sources for `whats-new fetch`. Verified live on 2026-10-11.
#
# Fields:
#   name, category (lab | news | community), kind (rss | hn | github_trending | hf_models | hf_papers | scrape), url
#   enabled     = false to skip a source (say why in a comment)
#   browser_ua  = true to send a browser User-Agent (default: an honest "whats-new/x.y" bot UA)
#   [source.filters]
#     keywords        = whole-word, case-insensitive match on title + summary; trailing * = prefix
#     link_pattern    = (scrape) regex an absolute URL must match to count as an article
#     min_points      = (hn) minimum HN points
#     lookback_hours  = re-check this many hours before `since` (seen table prevents repeats);
#                       default 24 (48 for kind=scrape, whose dates are day-granular)

# --------------------------------------------------------------------------- Labs / vendors

[[source]]
name = "Anthropic News"
category = "lab"
kind = "scrape"
# No official RSS (/rss.xml and /news/rss.xml are 404). The index renders server-side.
url = "https://www.anthropic.com/news"
filters.link_pattern = '^https://www\.anthropic\.com/news/[^/?#]+$'
filters.require_date = true  # undated /news links are evergreen pages linked from the body

[[source]]
name = "Anthropic Engineering"
category = "lab"
kind = "scrape"
# Engineering blog (Claude Code, agents, evals); no RSS either.
url = "https://www.anthropic.com/engineering"
filters.link_pattern = '^https://www\.anthropic\.com/engineering/[^/?#]+$'

[[source]]
name = "OpenAI News"
category = "lab"
kind = "rss"
url = "https://openai.com/news/rss.xml"

[[source]]
name = "Google DeepMind Blog"
