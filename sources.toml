[[source]]
name = "Meta AI Blog"
category = "lab"
kind = "scrape"
# No RSS. Note: ai.meta.com answers HTTP 400 to browser-like User-Agents; the bot UA works.
url = "https://ai.meta.com/blog/"
filters.link_pattern = '^https://ai\.meta\.com/blog/[^/?#]+/?$'

[[source]]
name = "Mistral AI News"
category = "lab"
kind = "rss"
# Official feed (mistral.ai/rss.xml redirects here).
url = "https://mistral.ai/news/rss"

[[source]]
